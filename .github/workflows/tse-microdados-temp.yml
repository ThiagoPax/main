name: tse-microdados-temp

on:
  push:
    paths:
      - '.github/workflows/tse-microdados-temp.yml'

permissions:
  contents: read

jobs:
  secoes:
    name: secoes-${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        year: ["2016","2018","2020","2022","2024"]
    steps:
      - name: Download oficial TSE
        shell: bash
        run: |
          set -e
          mkdir -p out work
          url="https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_secao/votacao_secao_${{ matrix.year }}_SP.zip"
          echo "$url" > out/source_url.txt
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 7200 \
            -A "Mozilla/5.0 Projeto28/1.0" -e "https://dadosabertos.tse.jus.br/" \
            "$url" -o work/source.zip
          sha256sum work/source.zip | tee out/source.sha256
          unzip -t work/source.zip | tail -n 3 | tee out/zip_test.txt

      - name: Filtrar município de São Paulo (CD_MUNICIPIO 71072)
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import csv, gzip, io, os, zipfile, sys
          year=os.environ["YEAR"]
          src="work/source.zip"
          outdir="out"
          os.makedirs(outdir,exist_ok=True)
          with zipfile.ZipFile(src) as z:
              members=[n for n in z.namelist() if n.lower().endswith(".csv")]
              preferred=[n for n in members if n.lower().endswith(f"_{year}_sp.csv")]
              member=(preferred or members)[0]
              with open(os.path.join(outdir,"member.txt"),"w",encoding="utf-8") as f: f.write(member+"\n")
              with z.open(member) as raw:
                  txt=io.TextIOWrapper(raw,encoding="latin-1",newline="")
                  reader=csv.reader(txt,delimiter=";",quotechar='"')
                  header=next(reader)
                  norm=[h.strip().strip('"').upper() for h in header]
                  try:
                      idx=norm.index("CD_MUNICIPIO")
                  except ValueError:
                      print("Cabeçalho sem CD_MUNICIPIO:",header,file=sys.stderr); sys.exit(3)
                  outfile=os.path.join(outdir,f"votacao_secao_{year}_SP_SAO_PAULO.csv.gz")
                  rows=0
                  with gzip.open(outfile,"wt",encoding="utf-8",newline="") as gz:
                      w=csv.writer(gz,delimiter=";",quotechar='"',quoting=csv.QUOTE_MINIMAL)
                      w.writerow(header)
                      for row in reader:
                          if idx < len(row) and row[idx].strip().strip('"')=="71072":
                              w.writerow(row); rows+=1
          size=os.path.getsize(outfile)
          with open(os.path.join(outdir,"manifest.txt"),"w",encoding="utf-8") as f:
              f.write(f"dataset=votacao_secao_{year}_SP\nmember={member}\nrows={rows}\nbytes_gzip={size}\n")
          print("member",member,"rows",rows,"gzip",size)
          if rows<=0: sys.exit(4)
          PY
        env:
          YEAR: ${{ matrix.year }}

      - name: Remover ZIP bruto
        run: rm -f work/source.zip

      - uses: actions/upload-artifact@v4
        with:
          name: "tse-votacao-secao-${{ matrix.year }}-sao-paulo"
          path: out/
          compression-level: 0
          retention-days: 1

  apoio2024:
    name: apoio-${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "local_votacao_2024"
            url: "https://cdn.tse.jus.br/estatistica/sead/odsele/eleitorado_locais_votacao/eleitorado_local_votacao_2024.zip"
          - id: "perfil_eleitor_secao_2024_SP"
            url: "https://cdn.tse.jus.br/estatistica/sead/odsele/perfil_eleitor_secao/perfil_eleitor_secao_2024_SP.zip"
          - id: "detalhe_votacao_secao_2024"
            url: "https://cdn.tse.jus.br/estatistica/sead/odsele/detalhe_votacao_secao/detalhe_votacao_secao_2024.zip"
    steps:
      - name: Download oficial TSE
        shell: bash
        run: |
          set -e
          mkdir -p out work
          url="${{ matrix.url }}"
          echo "$url" > out/source_url.txt
          curl -fL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 7200 \
            -A "Mozilla/5.0 Projeto28/1.0" -e "https://dadosabertos.tse.jus.br/" \
            "$url" -o work/source.zip
          sha256sum work/source.zip | tee out/source.sha256
          unzip -t work/source.zip | tail -n 3 | tee out/zip_test.txt

      - name: Filtrar município de São Paulo
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import csv, gzip, io, os, zipfile, sys, re
          ds=os.environ["DATASET"]
          src="work/source.zip"; outdir="out"
          with zipfile.ZipFile(src) as z:
              members=[n for n in z.namelist() if n.lower().endswith(".csv")]
              preferred=[n for n in members if "_sp.csv" in n.lower()]
              # Pacotes nacionais por UF: prioriza SP; pacotes únicos usam o único CSV.
              member=(preferred or members)[0]
              with open(os.path.join(outdir,"member.txt"),"w",encoding="utf-8") as f: f.write(member+"\n")
              with z.open(member) as raw:
                  txt=io.TextIOWrapper(raw,encoding="latin-1",newline="")
                  reader=csv.reader(txt,delimiter=";",quotechar='"')
                  header=next(reader)
                  norm=[h.strip().strip('"').upper() for h in header]
                  candidates=["CD_MUNICIPIO","CD_MUNICIPIO_TSE"]
                  idx=next((norm.index(x) for x in candidates if x in norm),None)
                  name_idx=norm.index("NM_MUNICIPIO") if "NM_MUNICIPIO" in norm else None
                  if idx is None and name_idx is None:
                      print("Sem identificador municipal",header,file=sys.stderr); sys.exit(3)
                  outfile=os.path.join(outdir,f"{ds}_SAO_PAULO.csv.gz")
                  rows=0
                  with gzip.open(outfile,"wt",encoding="utf-8",newline="") as gz:
                      w=csv.writer(gz,delimiter=";",quotechar='"',quoting=csv.QUOTE_MINIMAL)
                      w.writerow(header)
                      for row in reader:
                          ok=False
                          if idx is not None and idx < len(row):
                              ok = row[idx].strip().strip('"')=="71072"
                          if not ok and name_idx is not None and name_idx < len(row):
                              ok = row[name_idx].strip().strip('"').upper() in {"SÃO PAULO","SAO PAULO"}
                          if ok:
                              w.writerow(row); rows+=1
          size=os.path.getsize(outfile)
          with open(os.path.join(outdir,"manifest.txt"),"w",encoding="utf-8") as f:
              f.write(f"dataset={ds}\nmember={member}\nrows={rows}\nbytes_gzip={size}\n")
          print("member",member,"rows",rows,"gzip",size)
          if rows<=0: sys.exit(4)
          PY
        env:
          DATASET: ${{ matrix.id }}

      - name: Remover ZIP bruto
        run: rm -f work/source.zip

      - uses: actions/upload-artifact@v4
        with:
          name: "tse-${{ matrix.id }}-sao-paulo"
          path: out/
          compression-level: 0
          retention-days: 1
